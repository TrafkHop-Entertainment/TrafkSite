name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure HF access
        run: |
          git config --global url."https://${{ secrets.HF_TOKEN }}@huggingface.co/".insteadOf "git@hf.co:"

      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: Update all submodules except Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"

          git config submodule."Projects/SourceHop/Code".update none
          git config submodule."Projects/SourceHop/Notes".update none
          git config submodule."Projects/SourceHop/GodotScenes".update none
          git config submodule."Projects/TrafkTux/TrafkTux".update none

          git submodule update --init --recursive

      - name: Clean repo for GitHub Pages
        run: |
          rm -rf .idea .obsidian
          find . -name ".idea" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name ".obsidian" -type d -exec rm -rf {} + 2>/dev/null || true

          find . -name "*.sf2" -type f -exec truncate -s 0 {} +

          rm -rf "Projects/SourceHop/Models"
          rm -rf "Projects/SourceHop/GodotScenes"
          rm -rf "Projects/SourceHop/Audios/LMMS"
          rm -rf "Projects/TrafkCalc"
          rm -rf "Projects/Raufbold3bs-Scratch-Archive/Raufbold3bs-Scratch-Archive/Games"
          rm -rf "Projects/Raufbold3bs-Scratch-Archive/Raufbold3bs-Scratch-Archive/SourceCode/"

          sync

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment